<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit Product — SANCHAY AI</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
main{max-width:900px;margin:35px auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label{font-size:14px;color:#555}input{display:block;width:100%;box-sizing:border-box;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:7px}
button{margin-top:18px;padding:11px 18px;cursor:pointer}.error{color:#b42318}
</style>
</head>
<body><main>
<h1>SANCHAY <span>AI</span></h1><h2>Edit product</h2>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
<div class="grid">
<label>SKU *<input name="sku" required value="{{ product.sku }}"></label>
<label>Barcode<input name="barcode" value="{{ product.barcode or '' }}"></label>
<label>Product name *<input name="name" required value="{{ product.name }}"></label>
<label>Category<input name="category" value="{{ product.category }}"></label>
<label>Quantity<input name="quantity" type="number" min="0" required value="{{ product.quantity }}"></label>
<label>Purchase price<input name="purchase_price" type="number" min="0" step="0.01" required value="{{ product.purchase_price }}"></label>
<label>Selling price<input name="selling_price" type="number" min="0" step="0.01" required value="{{ product.selling_price }}"></label>
<label>Batch number<input name="batch_no" value="{{ product.batch_no }}"></label>
<label>Expiry date<input name="expiry_date" type="date" value="{{ product.expiry_date }}"></label>
<label>Low-stock threshold<input name="low_stock_threshold" type="number" min="0" required value="{{ product.low_stock_threshold }}"></label>
</div>
<button type="submit">Save changes</button>
<a href="{{ url_for('products') }}">Cancel</a>
</form>
</main></body>
</html>
